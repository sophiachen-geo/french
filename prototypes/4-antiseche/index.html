<title>Antisèche · Prototype 4</title>
<meta name="description" content="Les 12 fonctions de la conversation sur une seule feuille plastifiée : une tuile par intention, trois formules, une variante québécoise et un pictogramme qui explique.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap">
<link rel="stylesheet" href="style.css">
<script>
  try {
    var t = localStorage.getItem('antiseche:theme');
    if (t === '"light"' || t === '"dark"') document.documentElement.setAttribute('data-theme', JSON.parse(t));
  } catch (e) { /* stockage indisponible */ }
</script>
</head>
<body>
<a class="skip" href="#grille">Aller aux tuiles</a>

<header class="topbar">
  <div class="topbar-in">
    <span class="tb-id">Prototype 4 · Antisèche</span>
    <nav class="tb-nav" aria-label="Navigation des prototypes">
      <a href="../index.html">← Tous les prototypes</a>
      <a href="../../index.html">Site complet</a>
    </nav>
    <button type="button" class="tb-theme" id="theme-btn" aria-label="Changer de thème (clair ou sombre)">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<main class="sheet" id="sheet">
  <div class="mast">
    <div class="mast-t">
      <h1>Antisèche</h1>
      <p>Les 12 fonctions pour parler, sur une seule feuille. <span class="mast-hint">Une tuile = une intention. Touche une tuile pour la fiche complète.</span></p>
    </div>
  </div>

  <div class="ctrl" id="ctrl">
    <div class="seg" role="group" aria-label="Côté de la feuille">
      <button type="button" data-side="recto" aria-pressed="true">Recto</button>
      <button type="button" data-side="verso" aria-pressed="false">Verso</button>
    </div>
    <button type="button" class="tog tog-qc" id="tog-qc" aria-pressed="false">
      <span class="tog-box" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M2 6.4 4.8 9 10 3" fill="none" stroke="currentColor" stroke-width="2"/></svg></span>Québec
    </button>
    <button type="button" class="tog" id="tog-ex" aria-pressed="false">
      <span class="tog-box" aria-hidden="true"><svg viewBox="0 0 12 12"><path d="M2 6.4 4.8 9 10 3" fill="none" stroke="currentColor" stroke-width="2"/></svg></span>Exemples
    </button>
    <p class="sr" id="ctrl-side" aria-live="polite"></p>
  </div>

  <div class="sheet-body" id="sheet-body">
    <section id="recto" class="side" aria-label="Recto : les 12 fonctions">
      <div class="rhead">
        <div class="cline">
          <h2 class="lab">Où en est la conversation ?</h2>
          <ol class="stations" id="stations"></ol>
          <p class="cline-msg" id="cline-msg" aria-live="polite"></p>
        </div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="grid" id="grille" tabindex="-1"></div>
      <nav class="turn" id="turn" aria-label="Au verso"></nav>
    </section>

    <section id="verso" class="side" aria-label="Verso : repères" hidden></section>
  </div>
</main>

<dialog class="card" id="card" aria-labelledby="c-title">
  <div class="c-wrap">
    <div class="c-band">
      <span class="c-band-mod" id="c-mod"></span>
      <span class="c-band-pos" id="c-pos"></span>
      <button type="button" class="c-close" id="c-close">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="2.2" fill="none"/></svg>
        Fermer
      </button>
    </div>
    <div class="c-scroll" id="c-scroll"></div>
    <div class="c-foot">
      <button type="button" class="c-nav c-prev" id="c-prev"></button>
      <button type="button" class="c-nav c-next" id="c-next"></button>
    </div>
  </div>
</dialog>
